[project]
name = "ecommerce-agent-core"
version = "1.0.0"
description = "Reusable domain, Agent orchestration, evaluation, and model providers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jieba>=0.42.1,<1.0",
  "openai>=1.30.0,<2.0",
  "python-dotenv>=1.0.0,<2.0",
  "requests>=2.31.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_agent"]

