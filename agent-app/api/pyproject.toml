[project]
name = "ecommerce-agent-api"
version = "1.0.0"
description = "FastAPI delivery layer for ecommerce content generation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ecommerce-agent-core",
  "fastapi>=0.110.0,<1.0",
  "pydantic>=2.6.0,<3.0",
  "uvicorn>=0.29.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_api"]

