[project]
name = "ecommerce-content-agent-workspace"
version = "1.0.0"
description = "Monorepo for the ecommerce content Agent product, API, and ML pipelines."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ecommerce-agent-core",
  "ecommerce-agent-api",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
training = [
  "accelerate>=0.28",
  "bitsandbytes>=0.45",
  "datasets>=2.14",
  "llamafactory",
  "peft>=0.10",
  "torch>=2.5",
  "torchaudio>=2.5",
  "transformers>=4.45",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
llamafactory = { path = "model-training/vendor/LLaMA-Factory", editable = true }
ecommerce-agent-core = { workspace = true }
ecommerce-agent-api = { workspace = true }

[tool.uv.workspace]
members = ["agent-app/agent-core", "agent-app/api"]

[tool.pytest.ini_options]
testpaths = ["agent-app/api/tests", "agent-app/agent-core/tests"]
pythonpath = ["agent-app/api/src", "agent-app/agent-core/src"]
